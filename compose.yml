name: career-quest
services:
  web:
    build: .
    image: career-quest:${RELEASE_SHA:-local}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/.runtime/career-quest.sqlite
      NODE_ENV: production
      RELEASE_SHA: ${RELEASE_SHA:-local}
    ports:
      - "127.0.0.1:3500:3000"
    volumes:
      - career_quest_data:/app/.runtime
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  career_quest_data:
